<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Res Polar Transformer Pro</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #0d0e12; 
            color: #f0f3f8; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 24px 16px; 
            margin: 0; 
            min-height: 100vh;
        }
        h2 { margin: 0 0 16px 0; font-weight: 600; letter-spacing: -0.5px; }

        /* ── Dropzone File Upload ── */
        .upload-container {
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
        }
        .dropzone {
            border: 2px dashed #333d4d;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            background: #131720;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: #00a8ff;
            background: #171d2a;
        }
        .dropzone p { margin: 0; font-size: 0.9rem; color: #8a99ad; }
        .dropzone span { color: #00a8ff; font-weight: 600; }

        /* ── Main editor canvas ── */
        .main-area { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; max-width: 1200px; width: 100%; }
        .container { 
            position: relative; 
            cursor: crosshair; 
            background: #000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0; 
        }
        #canvas { display: block; max-width: 60vw; max-height: 55vh; border: 1px solid #222; }
        #overlay { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; }

        /* ── Controls ── */
        .controls { 
            background: #131720; 
            padding: 20px; 
            border-radius: 12px; 
            width: 340px; 
            display: grid; 
            gap: 12px; 
            border: 1px solid #222e3e; 
            flex-shrink: 0; 
        }
        .slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; color: #a0aec0; }
        input[type="range"] { width: 55%; accent-color: #00a8ff; cursor: pointer; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
        button { padding: 10px 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: background 0.2s, opacity 0.2s; }
        .unroll  { background: #00a8ff; color: white; }
        .reroll  { background: #9c88ff; color: white; }
        .reset   { background: #2d3748; color: white; }
        .dl-main  { background: #2ed573; color: white; grid-column: span 2; }
        .dl-inner { background: #ff6b35; color: white; grid-column: span 2; }
        button:hover { opacity: 0.88; }
        
        .checkbox-row { display: flex; align-items: center; gap: 18px; font-size: 0.82rem; color: #a0aec0; padding: 2px 0; }
        .checkbox-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
        .checkbox-row input[type="checkbox"] {
            appearance: none; width: 16px; height: 16px; border: 2px solid #4a5568; border-radius: 4px;
            background: #1a202c; cursor: pointer; position: relative; transition: 0.15s; flex-shrink: 0;
        }
        .checkbox-row input[type="checkbox"]:checked { background: #00a8ff; border-color: #00a8ff; }
        .checkbox-row input[type="checkbox"]:checked::after { content: '✓'; position: absolute; color: white; font-size: 11px; top: -2px; left: 2px; }
        .section-label { font-size: 0.7rem; color: #718096; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-top: 4px; }
        hr { border: none; border-top: 1px solid #2d3748; margin: 4px 0; }

        /* ── Preview strip ── */
        .preview-strip { display: flex; gap: 20px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
        .preview-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .preview-box span { font-size: 0.75rem; color: #718096; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
        .preview-box canvas {
            border: 1px solid #2d3748; border-radius: 6px; background: #000;
            max-width: 220px; max-height: 160px; display: block;
        }
        #previewInner { border-radius: 50% !important; width: 140px; height: 140px; }
    </style>
</head>
<body>

<h2>High-Resolution Polar Transformer</h2>

<div class="upload-container">
    <div class="dropzone" id="dropzone">
        <p>Drag & Drop an image here, or <span>browse</span></p>
        <input type="file" id="upload" accept="image/*" style="display: none;">
    </div>
</div>

<div class="main-area">
    <div class="container" id="canvasWrapper">
        <canvas id="canvas"></canvas>
        <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
        <div class="slider-row">
            <label>Inner Radius: <span id="inLab">40</span>px</label>
            <input type="range" id="innerRadius" min="0" max="500" value="40">
        </div>
        <div class="slider-row">
            <label>Outer Radius: <span id="outLab">200</span>px</label>
            <input type="range" id="outerRadius" min="10" max="1000" value="200">
        </div>

        <hr>
        <div class="section-label">Output Resolution</div>
        <div class="slider-row">
            <label>Scale: <span id="scaleLab">2</span>×</label>
            <input type="range" id="outputScale" min="1" max="4" step="0.5" value="2">
        </div>

        <hr>
        <div class="section-label">Output Adjustments</div>

        <div class="slider-row">
            <label>H Shift: <span id="shiftLab">0</span>px</label>
            <input type="range" id="hShift" min="-500" max="500" value="0">
        </div>
        <div class="checkbox-row">
            <label><input type="checkbox" id="flipH"> Flip Horizontal</label>
            <label><input type="checkbox" id="flipV"> Flip Vertical</label>
        </div>

        <hr>
        <div class="btn-grid">
            <button class="unroll" onclick="runTransform('unroll')">Unroll (Equirect)</button>
            <button class="reroll" onclick="runTransform('reroll')">Re-roll (Polar)</button>
            <button class="reset"  onclick="resetImage()">Reset Guides</button>
            <button class="dl-main"  onclick="downloadResult()">⬇ Download Current View</button>
            <button class="dl-inner" onclick="downloadInnerCircle()">⬇ Download Inner Circle</button>
        </div>
    </div>
</div>

<div class="preview-strip">
    <div class="preview-box">
        <span>Original</span>
        <canvas id="previewOriginal"></canvas>
    </div>
    <div class="preview-box">
        <span>Warp Output</span>
        <canvas id="previewWarp"></canvas>
    </div>
    <div class="preview-box">
        <span>Inner Circle</span>
        <canvas id="previewInner"></canvas>
    </div>
</div>

<script>
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const octx    = overlay.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    const previewOrig  = document.getElementById('previewOriginal');
    const previewWarp  = document.getElementById('previewWarp');
    const previewInner = document.getElementById('previewInner');

    const fileInput = document.getElementById('upload');
    const dropzone  = document.getElementById('dropzone');

    let img = new Image();
    let currentObjectUrl = null;
    let centerX, centerY, isDragging = false;
    let currentMode = null; 
    
    const warpCanvas = document.createElement('canvas');
    const warpCtx    = warpCanvas.getContext('2d');
    let hasWarpResult = false;

    // ── Upload Logic ────────────────────────────────────────────────────────
    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('click', (e) => {
        e.target.value = null;
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            handleFile(e.target.files[0]);
        }
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.remove('dragover');
        }, false);
    });

    dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files[0]) {
            handleFile(files[0]);
        }
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            alert('Please select a valid image file.');
            return;
        }

        if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
        }

        currentObjectUrl = URL.createObjectURL(file);
        img = new Image();
        img.onload = () => {
            canvas.width  = overlay.width  = img.width;
            canvas.height = overlay.height = img.height;
            warpCanvas.width  = img.width;
            warpCanvas.height = img.height;
            centerX = img.width  / 2;
            centerY = img.height / 2;
            
            const maxSide = Math.max(img.width, img.height);
            document.getElementById('innerRadius').max = Math.round(maxSide / 2);
            document.getElementById('outerRadius').max = Math.round(maxSide);
            document.getElementById('hShift').max =  img.width;
            document.getElementById('hShift').min = -img.width;
            
            hasWarpResult = false;
            currentMode = null;
            resetImage();
            updateOriginalPreview();
            updateInnerPreview();
        };
        img.src = currentObjectUrl;
    }

    // ── Reset / guides ──────────────────────────────────────────────────────
    function resetImage() {
        if (!img.src) return;
        ctx.drawImage(img, 0, 0);
        drawGuides();
    }

    function drawGuides() {
        if (!img.src) return;
        octx.clearRect(0, 0, overlay.width, overlay.height);
        const rIn  = +document.getElementById('innerRadius').value;
        const rOut = +document.getElementById('outerRadius').value;
        document.getElementById('inLab').innerText    = rIn;
        document.getElementById('outLab').innerText   = rOut;
        document.getElementById('shiftLab').innerText = document.getElementById('hShift').value;

        octx.lineWidth = 2;
        octx.strokeStyle = '#ff4757';
        octx.beginPath(); octx.arc(centerX, centerY, rIn, 0, Math.PI*2); octx.stroke();
        octx.strokeStyle = '#2ed573'; octx.setLineDash([5,5]);
        octx.beginPath(); octx.arc(centerX, centerY, rOut, 0, Math.PI*2); octx.stroke();
        octx.setLineDash([]);
        octx.fillStyle = 'white'; octx.beginPath(); octx.arc(centerX, centerY, 3, 0, Math.PI*2); octx.fill();
    }

    // ── Center Pointer Dragging ─────────────────────────────────────────────
    wrapper.addEventListener('mousedown', (e) => { isDragging = true; updateCenter(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });
    wrapper.addEventListener('mousemove', (e) => { if (isDragging) updateCenter(e); });
    
    wrapper.addEventListener('touchstart', (e) => { isDragging = true; updateCenter(e.touches[0]); e.preventDefault(); }, {passive: false});
    window.addEventListener('touchend', () => { isDragging = false; });
    wrapper.addEventListener('touchmove', (e) => { if (isDragging) { updateCenter(e.touches[0]); e.preventDefault(); } }, {passive: false});

    function updateCenter(e) {
        const rect = canvas.getBoundingClientRect();
        centerX = (e.clientX - rect.left) * (canvas.width  / rect.width);
        centerY = (e.clientY - rect.top)  * (canvas.height / rect.height);
        drawGuides();
        updateInnerPreview();
        if (currentMode) runTransform(currentMode);
    }

    // ── Bilinear sampler ────────────────────────────────────────────────────
    function getBilinearPixel(data, w, h, x, y) {
        const x0 = Math.floor(x), x1 = Math.min(x0+1, w-1);
        const y0 = Math.floor(y), y1 = Math.min(y0+1, h-1);
        const dx = x-x0, dy = y-y0;
        const i00=(y0*w+x0)*4, i01=(y0*w+x1)*4, i10=(y1*w+x0)*4, i11=(y1*w+x1)*4;
        const out=[];
        for(let i=0;i<4;i++){
            const top = data[i00+i]*(1-dx)+data[i01+i]*dx;
            const bot = data[i10+i]*(1-dx)+data[i11+i]*dx;
            out[i] = top*(1-dy)+bot*dy;
        }
        return out;
    }

    // ── Transform ───────────────────────────────────────────────────────────
    function runTransform(mode) {
        if (!img.src) return;
        currentMode = mode;
        
        const srcW = img.width, srcH = img.height;
        const scale  = parseFloat(document.getElementById('outputScale').value);
        const outW   = Math.round(srcW * scale);
        const outH   = Math.round(srcH * scale);
        const rIn    = parseFloat(document.getElementById('innerRadius').value) * scale;
        const rOut   = parseFloat(document.getElementById('outerRadius').value) * scale;
        const hShift = parseFloat(document.getElementById('hShift').value) * scale;
        const doFlipH = document.getElementById('flipH').checked;
        const doFlipV = document.getElementById('flipV').checked;

        const srcC = document.createElement('canvas');
        srcC.width = srcW; srcC.height = srcH;
        srcC.getContext('2d').drawImage(img, 0, 0);
        const srcData = srcC.getContext('2d').getImageData(0, 0, srcW, srcH).data;

        const cx = centerX * scale;
        const cy = centerY * scale;
        const output = new ImageData(outW, outH);

        for (let y = 0; y < outH; y++) {
            for (let x = 0; x < outW; x++) {
                const sx = doFlipH ? (outW-1-x) : x;
                const sy = doFlipV ? (outH-1-y) : y;
                
                let rTot = 0, gTot = 0, bTot = 0, aTot = 0;
                let validSamples = 0;

                // 2x2 Supersampling to mimic GIMP's smooth rendering
                for(let dy = 0.25; dy < 1; dy += 0.5) {
                    for(let dx = 0.25; dx < 1; dx += 0.5) {
                        const pxX = sx + dx;
                        const pxY = sy + dy;
                        
                        let srcX, srcY;
                        
                        if (mode === 'unroll') {
                            const shiftFrac = hShift / outW;
                            // Offset by -PI/2 to start from the top
                            const theta = ((pxX / outW) + shiftFrac) * Math.PI * 2 - Math.PI / 2;
                            
                            // Vertically inverted mapping: sy=0 matches the inner radius
                            const r = rIn + (pxY / outH) * (rOut - rIn);
                            
                            srcX = (cx + r * Math.cos(theta)) / scale;
                            srcY = (cy + r * Math.sin(theta)) / scale;
                        } else {
                            const dX = pxX - cx, dY = pxY - cy;
                            const r = Math.sqrt(dX*dX + dY*dY);
                            // Compensate the Unroll offset with +PI/2
                            const theta = Math.atan2(dY, dX) + Math.PI / 2;
                            
                            const rawX = (theta / (Math.PI * 2)) * outW + hShift;
                            srcX = (((rawX % outW) + outW) % outW) / scale;
                            
                            // Inverse mapping for proper re-rolling
                            srcY = ((r - rIn) / (rOut - rIn)) * srcH;
                        }

                        if (srcX >= 0 && srcX < srcW && srcY >= 0 && srcY < srcH) {
                            const px = getBilinearPixel(srcData, srcW, srcH, srcX, srcY);
                            rTot += px[0]; gTot += px[1]; bTot += px[2]; aTot += px[3];
                            validSamples++;
                        }
                    }
                }

                const oIdx = (y * outW + x) * 4;
                if (validSamples > 0) {
                    output.data[oIdx]   = rTot / validSamples;
                    output.data[oIdx+1] = gTot / validSamples;
                    output.data[oIdx+2] = bTot / validSamples;
                    output.data[oIdx+3] = aTot / validSamples; // Proper Alpha support
                } else {
                    // Return clear transparency if entirely out-of-bounds
                    output.data[oIdx] = output.data[oIdx+1] = output.data[oIdx+2] = output.data[oIdx+3] = 0;
                }
            }
        }

        warpCanvas.width  = outW;
        warpCanvas.height = outH;
        warpCtx.putImageData(output, 0, 0);
        hasWarpResult = true;

        canvas.width  = overlay.width  = srcW;
        canvas.height = overlay.height = srcH;
        ctx.drawImage(warpCanvas, 0, 0, srcW, srcH);
        octx.clearRect(0, 0, srcW, srcH);

        updateWarpPreview();
        updateInnerPreview();
    }

    // ── Preview helpers ─────────────────────────────────────────────────────
    const PREV_W = 220, PREV_H = 150;

    function updateOriginalPreview() {
        if (!img.src) return;
        const scale = Math.min(PREV_W / img.width, PREV_H / img.height);
        previewOrig.width  = Math.round(img.width  * scale);
        previewOrig.height = Math.round(img.height * scale);
        previewOrig.getContext('2d').drawImage(img, 0, 0, previewOrig.width, previewOrig.height);
    }

    function updateWarpPreview() {
        if (!hasWarpResult) return;
        const scale = Math.min(PREV_W / warpCanvas.width, PREV_H / warpCanvas.height);
        previewWarp.width  = Math.round(warpCanvas.width  * scale);
        previewWarp.height = Math.round(warpCanvas.height * scale);
        previewWarp.getContext('2d').drawImage(warpCanvas, 0, 0, previewWarp.width, previewWarp.height);
    }

    function updateInnerPreview() {
        if (!img.src) return;
        const rIn = parseFloat(document.getElementById('innerRadius').value);
        if (rIn <= 0) { previewInner.getContext('2d').clearRect(0,0,140,140); return; }

        const diameter = Math.ceil(rIn * 2);
        previewInner.width  = 140;
        previewInner.height = 140;
        const pc = previewInner.getContext('2d');
        pc.clearRect(0, 0, 140, 140);
        pc.beginPath(); pc.arc(70, 70, 70, 0, Math.PI*2); pc.clip();
        pc.drawImage(
            img,
            centerX - rIn, centerY - rIn, diameter, diameter,
            0, 0, 140, 140
        );
    }

    // ── Downloads ───────────────────────────────────────────────────────────
    function downloadResult() {
        if (!hasWarpResult) { alert('Run a transform first.'); return; }
        const scale = parseFloat(document.getElementById('outputScale').value);
        const link = document.createElement('a');
        link.download = `transformed_${scale}x.png`;
        link.href = warpCanvas.toDataURL('image/png');
        link.click();
    }

    function downloadInnerCircle() {
        if (!img.src) return;
        const scale = parseFloat(document.getElementById('outputScale').value);
        const rIn = parseFloat(document.getElementById('innerRadius').value) * scale;
        if (rIn <= 0) { alert('Inner radius is 0 — nothing to export.'); return; }

        const diameter = Math.ceil(rIn * 2);
        const offC = document.createElement('canvas');
        offC.width  = diameter;
        offC.height = diameter;
        const offCtx = offC.getContext('2d');
        offCtx.beginPath(); offCtx.arc(rIn, rIn, rIn, 0, Math.PI*2); offCtx.clip();
        offCtx.drawImage(
            img,
            centerX - rIn/scale, centerY - rIn/scale, rIn/scale*2, rIn/scale*2,
            0, 0, diameter, diameter
        );

        const link = document.createElement('a');
        link.download = `inner_circle_${scale}x.png`;
        link.href = offC.toDataURL('image/png');
        link.click();
    }

    // ── Slider and Input Event Listeners ────────────────────────────────────
    document.getElementById('outputScale').oninput = function() {
        document.getElementById('scaleLab').innerText = this.value;
    };
    
    document.querySelectorAll('input[type="range"]:not(#outputScale)').forEach(i => {
        i.addEventListener('input', () => {
            drawGuides();
            if (currentMode) runTransform(currentMode);
        });
    });

    ['flipH', 'flipV'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            if (currentMode) runTransform(currentMode);
        });
    });

    document.getElementById('innerRadius').addEventListener('input', () => {
        updateInnerPreview();
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Texture Batch Variator</title>
<style>
:root {
  --font-sans: 'JetBrains Mono', 'Consolas', monospace;
  --color-border-secondary: rgba(100,220,180,.28);
  --color-border-tertiary: rgba(100,220,180,.15);
  --color-border-primary: rgba(100,220,180,.45);
  --color-border-info: rgba(100,160,255,.5);
  --color-background-secondary: rgba(14,20,38,.75);
  --color-background-primary: rgba(8,12,26,.9);
  --color-background-info: rgba(100,160,255,.12);
  --color-text-primary: #e8f0ff;
  --color-text-secondary: rgba(180,200,220,.75);
  --color-text-info: rgba(150,190,255,.95);
  --border-radius-lg: 10px;
  --border-radius-md: 6px;
}
html, body {
  margin: 0;
  background: #05070f;
  color: var(--color-text-primary);
  font-family: var(--font-sans);
}
</style>
</head>
<body>

<h2 class="sr-only">Planet texture processor — upload planet images to apply randomized contrast and hue tinting</h2>

<style>
* { box-sizing: border-box; }
body { margin: 0; }
.app { padding: 1.5rem 0; font-family: var(--font-sans); }
.dropzone {
  border: 1.5px dashed var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
  padding: 2.5rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  background: var(--color-background-secondary);
  position: relative;
}
.dropzone:hover, .dropzone.drag-over {
  background: var(--color-background-info);
  border-color: var(--color-border-info);
}
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.dropzone-label { font-size: 15px; color: var(--color-text-secondary); pointer-events: none; }
.dropzone-label strong { display: block; font-size: 17px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 1.25rem 0;
}
.ctrl-card {
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  padding: 10px 14px;
}
.ctrl-card label { font-size: 12px; color: var(--color-text-secondary); display: block; margin-bottom: 6px; }
.ctrl-card .val { font-size: 14px; font-weight: 500; color: var(--color-text-primary); float: right; }
.ctrl-card input[type=range] { width: 100%; margin-top: 4px; }
.hue-preview {
  width: 100%;
  height: 12px;
  border-radius: 6px;
  margin-top: 6px;
}
.btn-row { display: flex; gap: 8px; margin: 1rem 0; flex-wrap: wrap; }
button {
  padding: 8px 18px;
  border-radius: var(--border-radius-md);
  font-size: 14px;
  cursor: pointer;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  font-family: var(--font-sans);
  transition: background 0.1s, transform 0.08s;
}
button:hover { background: var(--color-background-secondary); }
button:active { transform: scale(0.98); }
button.primary {
  background: var(--color-background-primary);
  border-color: var(--color-border-primary);
  font-weight: 500;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
  margin-top: 1.25rem;
}
.planet-card {
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
}
.planet-card canvas { display: block; width: 100%; aspect-ratio: 1; background: #000; }
.planet-card-info { padding: 8px 12px 10px; }
.planet-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.planet-meta { font-size: 11px; color: var(--color-text-secondary); }
.planet-meta span { display: inline-block; margin-right: 8px; }
.dl-btn { font-size: 11px; padding: 4px 10px; margin-top: 6px; width: 100%; text-align: center; }
.empty-state { text-align: center; padding: 2rem 0; color: var(--color-text-secondary); font-size: 14px; }
.badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--color-background-info);
  color: var(--color-text-info);
  margin-left: 6px;
  vertical-align: middle;
}
</style>

<div class="app">

<div class="dropzone" id="dropzone">
  <input type="file" id="fileInput" accept="image/*,.zip" multiple />
  <div class="dropzone-label">
    <strong><i class="ti ti-planet" aria-hidden="true"></i> drop planet images here</strong>
    PNG, JPG, WebP — or a ZIP of images
  </div>
</div>

<div class="controls" id="controls" style="display:none;">
  <div class="ctrl-card">
    <label>contrast range <span class="val" id="contrastVal">0.8 – 1.6</span></label>
    <div style="display:flex;gap:6px;align-items:center;margin-top:4px;">
      <input type="range" id="contrastMin" min="0.5" max="1.5" step="0.05" value="0.8" style="flex:1;" />
      <input type="range" id="contrastMax" min="0.7" max="2.5" step="0.05" value="1.6" style="flex:1;" />
    </div>
  </div>
  <div class="ctrl-card">
    <label>hue saturation <span class="val" id="satVal">30%</span></label>
    <input type="range" id="satRange" min="5" max="80" step="1" value="30" />
    <canvas class="hue-preview" id="huePreview" width="200" height="12"></canvas>
  </div>
  <div class="ctrl-card">
    <label>hue intensity <span class="val" id="hueIntVal">25%</span></label>
    <input type="range" id="hueIntRange" min="5" max="60" step="1" value="25" />
  </div>
  <div class="ctrl-card" style="display:flex;flex-direction:column;justify-content:center;">
    <label>brightness boost <span class="val" id="brightVal">1.05×</span></label>
    <input type="range" id="brightRange" min="0.8" max="1.4" step="0.05" value="1.05" />
  </div>
</div>

<div class="btn-row" id="btnRow" style="display:none;">
  <button class="primary" onclick="processAll()"><i class="ti ti-wand" aria-hidden="true"></i> randomize all</button>
  <button onclick="rerandomizeHues()"><i class="ti ti-refresh" aria-hidden="true"></i> new hues only</button>
  <button onclick="rerandomizeContrast()"><i class="ti ti-adjustments" aria-hidden="true"></i> new contrast only</button>
  <button onclick="downloadAll()"><i class="ti ti-download" aria-hidden="true"></i> download all</button>
  <button onclick="clearAll()"><i class="ti ti-trash" aria-hidden="true"></i> clear</button>
</div>

<div class="grid" id="grid">
  <div class="empty-state" id="empty"><i class="ti ti-planet" aria-hidden="true" style="font-size:32px;display:block;margin-bottom:8px;"></i>no planets yet — drop some images above</div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const state = { images: [], processed: [] };

function hueToRgb(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}

function drawHuePreview(){
  const c=document.getElementById('huePreview');
  const ctx=c.getContext('2d');
  const s=parseFloat(document.getElementById('satRange').value);
  for(let x=0;x<200;x++){
    const h=x/200*360;
    const [r,g,b]=hueToRgb(h,s,55);
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(x,0,1,12);
  }
}

function updateLabels(){
  const cMin=parseFloat(document.getElementById('contrastMin').value);
  const cMax=parseFloat(document.getElementById('contrastMax').value);
  document.getElementById('contrastVal').textContent=`${cMin.toFixed(2)} – ${cMax.toFixed(2)}`;
  document.getElementById('satVal').textContent=`${document.getElementById('satRange').value}%`;
  document.getElementById('hueIntVal').textContent=`${document.getElementById('hueIntRange').value}%`;
  document.getElementById('brightVal').textContent=`${parseFloat(document.getElementById('brightRange').value).toFixed(2)}×`;
  drawHuePreview();
}

['contrastMin','contrastMax','satRange','hueIntRange','brightRange'].forEach(id=>{
  document.getElementById(id).addEventListener('input',updateLabels);
});
drawHuePreview();

function randBetween(a,b){ return a + Math.random()*(b-a); }

function processImage(img, name, idx){
  const cMin=parseFloat(document.getElementById('contrastMin').value);
  const cMax=parseFloat(document.getElementById('contrastMax').value);
  const sat=parseFloat(document.getElementById('satRange').value);
  const hueInt=parseFloat(document.getElementById('hueIntRange').value)/100;
  const brightness=parseFloat(document.getElementById('brightRange').value);

  const contrast = randBetween(Math.min(cMin,cMax), Math.max(cMin,cMax));
  const hue = Math.random()*360;

  const [hr,hg,hb] = hueToRgb(hue, sat, 50);

  const size = Math.min(img.width, img.height, 512);
  const offscreen = document.createElement('canvas');
  offscreen.width = size; offscreen.height = size;
  const oc = offscreen.getContext('2d');

  oc.drawImage(img, 0, 0, size, size);
  const id = oc.getImageData(0,0,size,size);
  const d = id.data;

  for(let i=0;i<d.length;i+=4){
    let r=d[i], g=d[i+1], b=d[i+2];
    r = 128 + (r-128)*contrast;
    g = 128 + (g-128)*contrast;
    b = 128 + (b-128)*contrast;
    r = r*brightness; g = g*brightness; b = b*brightness;
    r = r*(1-hueInt) + hr*hueInt;
    g = g*(1-hueInt) + hg*hueInt;
    b = b*(1-hueInt) + hb*hueInt;
    d[i]=Math.max(0,Math.min(255,r));
    d[i+1]=Math.max(0,Math.min(255,g));
    d[i+2]=Math.max(0,Math.min(255,b));
  }
  oc.putImageData(id,0,0);

  return { canvas: offscreen, contrast: contrast.toFixed(2), hue: Math.round(hue), name };
}

function renderCards(){
  const grid = document.getElementById('grid');
  document.getElementById('empty').style.display = state.processed.length ? 'none' : 'block';
  const old = grid.querySelectorAll('.planet-card');
  old.forEach(e=>e.remove());

  state.processed.forEach((p,i)=>{
    const card = document.createElement('div');
    card.className = 'planet-card';
    const displayCanvas = document.createElement('canvas');
    const size = p.canvas.width;
    displayCanvas.width = size; displayCanvas.height = size;
    const dc = displayCanvas.getContext('2d');
    dc.drawImage(p.canvas, 0, 0);

    const info = document.createElement('div');
    info.className = 'planet-card-info';
    const shortName = p.name.length > 18 ? p.name.slice(0,16)+'…' : p.name;
    info.innerHTML = `<div class="planet-name">${shortName}</div>
      <div class="planet-meta">
        <span>contrast ${p.contrast}×</span>
        <span>hue ${p.hue}°</span>
      </div>`;
    const dlBtn = document.createElement('button');
    dlBtn.className = 'dl-btn';
    dlBtn.innerHTML = '<i class="ti ti-download" aria-hidden="true"></i> download';
    dlBtn.onclick = ()=>{
      const a = document.createElement('a');
      a.href = p.canvas.toDataURL('image/png');
      a.download = `planet_${p.name.replace(/\.[^.]+$/,'')}_processed.png`;
      a.click();
    };
    info.appendChild(dlBtn);
    card.appendChild(displayCanvas);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

function processAll(){
  state.processed = state.images.map((img,i)=>processImage(img.el, img.name, i));
  renderCards();
}

function rerandomizeHues(){
  state.processed = state.images.map((img,i)=>{
    const old = state.processed[i];
    const sat=parseFloat(document.getElementById('satRange').value);
    const hueInt=parseFloat(document.getElementById('hueIntRange').value)/100;
    const brightness=parseFloat(document.getElementById('brightRange').value);
    const contrast = old ? parseFloat(old.contrast) : 1.0;
    const hue = Math.random()*360;
    const [hr,hg,hb] = hueToRgb(hue, sat, 50);
    const size = Math.min(img.el.width, img.el.height, 512);
    const offscreen = document.createElement('canvas');
    offscreen.width = size; offscreen.height = size;
    const oc = offscreen.getContext('2d');
    oc.drawImage(img.el, 0, 0, size, size);
    const id = oc.getImageData(0,0,size,size);
    const d = id.data;
    for(let j=0;j<d.length;j+=4){
      let r=d[j], g=d[j+1], b=d[j+2];
      r = 128+(r-128)*contrast; g=128+(g-128)*contrast; b=128+(b-128)*contrast;
      r*=brightness; g*=brightness; b*=brightness;
      r=r*(1-hueInt)+hr*hueInt; g=g*(1-hueInt)+hg*hueInt; b=b*(1-hueInt)+hb*hueInt;
      d[j]=Math.max(0,Math.min(255,r)); d[j+1]=Math.max(0,Math.min(255,g)); d[j+2]=Math.max(0,Math.min(255,b));
    }
    oc.putImageData(id,0,0);
    return { canvas: offscreen, contrast: contrast.toFixed(2), hue: Math.round(hue), name: img.name };
  });
  renderCards();
}

function rerandomizeContrast(){
  const cMin=parseFloat(document.getElementById('contrastMin').value);
  const cMax=parseFloat(document.getElementById('contrastMax').value);
  const sat=parseFloat(document.getElementById('satRange').value);
  const hueInt=parseFloat(document.getElementById('hueIntRange').value)/100;
  const brightness=parseFloat(document.getElementById('brightRange').value);
  state.processed = state.images.map((img,i)=>{
    const old = state.processed[i];
    const hue = old ? old.hue : Math.random()*360;
    const contrast = randBetween(Math.min(cMin,cMax), Math.max(cMin,cMax));
    const [hr,hg,hb] = hueToRgb(hue, sat, 50);
    const size = Math.min(img.el.width, img.el.height, 512);
    const offscreen = document.createElement('canvas');
    offscreen.width = size; offscreen.height = size;
    const oc = offscreen.getContext('2d');
    oc.drawImage(img.el, 0, 0, size, size);
    const id = oc.getImageData(0,0,size,size);
    const d = id.data;
    for(let j=0;j<d.length;j+=4){
      let r=d[j], g=d[j+1], b=d[j+2];
      r=128+(r-128)*contrast; g=128+(g-128)*contrast; b=128+(b-128)*contrast;
      r*=brightness; g*=brightness; b*=brightness;
      r=r*(1-hueInt)+hr*hueInt; g=g*(1-hueInt)+hg*hueInt; b=b*(1-hueInt)+hb*hueInt;
      d[j]=Math.max(0,Math.min(255,r)); d[j+1]=Math.max(0,Math.min(255,g)); d[j+2]=Math.max(0,Math.min(255,b));
    }
    oc.putImageData(id,0,0);
    return { canvas: offscreen, contrast: contrast.toFixed(2), hue: Math.round(hue), name: img.name };
  });
  renderCards();
}

async function downloadAll(){
  if(!state.processed.length) return;
  const zip = new JSZip();
  state.processed.forEach(p=>{
    const dataUrl = p.canvas.toDataURL('image/png');
    const base64 = dataUrl.split(',')[1];
    zip.file(`planet_${p.name.replace(/\.[^.]+$/,'')}_processed.png`, base64, {base64:true});
  });
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planets_processed.zip';
  a.click();
}

function clearAll(){
  state.images=[];state.processed=[];
  document.getElementById('controls').style.display='none';
  document.getElementById('btnRow').style.display='none';
  document.getElementById('grid').querySelectorAll('.planet-card').forEach(e=>e.remove());
  document.getElementById('empty').style.display='block';
  document.getElementById('fileInput').value='';
}

function showControls(){
  document.getElementById('controls').style.display='grid';
  document.getElementById('btnRow').style.display='flex';
}

async function loadImageElement(file){
  return new Promise(res=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>res(img);
    img.src = url;
  });
}

async function handleFiles(files){
  const imageFiles = [];
  for(const file of files){
    if(file.name.endsWith('.zip') || file.type==='application/zip'){
      try {
        const zip = await JSZip.loadAsync(file);
        for(const [name, entry] of Object.entries(zip.files)){
          if(/\.(png|jpe?g|webp|gif)$/i.test(name) && !entry.dir){
            const blob = await entry.async('blob');
            const imgFile = new File([blob], name.split('/').pop(), {type:'image/png'});
            imageFiles.push(imgFile);
          }
        }
      } catch(e){ console.error('ZIP error', e); }
    } else if(file.type.startsWith('image/')){
      imageFiles.push(file);
    }
  }
  for(const f of imageFiles){
    const el = await loadImageElement(f);
    state.images.push({el, name: f.name});
  }
  if(state.images.length){ showControls(); processAll(); }
}

document.getElementById('fileInput').addEventListener('change', e=>{
  handleFiles(Array.from(e.target.files));
});

const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', ()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop', e=>{
  e.preventDefault();
  dz.classList.remove('drag-over');
  handleFiles(Array.from(e.dataTransfer.files));
});
</script>

</body>
</html>
